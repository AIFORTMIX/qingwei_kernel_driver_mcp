name: Build Kernel Driver

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: 'Android 版本'
        required: true
        type: choice
        options:
          - android13
          - android14
          - android15
          - android16
        default: 'android14'
      kernel_version:
        description: '内核版本'
        required: true
        type: choice
        options:
          - "5.10"
          - "5.15"
          - "6.1"
          - "6.6"
          - "6.12"
        default: '6.1'
      sub_level:
        description: '内核子版本号 (sub_level)'
        required: false
        default: '0'
      os_patch_level:
        description: '安全补丁日期 (YYYY-MM)'
        required: false
        default: '2025-01'
      kernel_release:
        description: '目标设备 uname -r 的完整值 (留空则自动生成)'
        required: false
        default: ''
      localversion_suffix:
        description: '追加到 UTS_RELEASE 的 localversion 后缀 (仅 kernel_release 留空时生效)'
        required: false
        default: ''
      debug:
        description: '调试构建 (含调试符号)'
        required: false
        type: boolean
        default: false

  push:
    paths:
      - 'driver/**'
    branches: [main]

env:
  ANDROID_VERSION: ${{ inputs.android_version || 'android14' }}
  KERNEL_VERSION: ${{ inputs.kernel_version || '6.1' }}
  SUB_LEVEL: ${{ inputs.sub_level || '0' }}
  OS_PATCH_LEVEL: ${{ inputs.os_patch_level || '2025-01' }}
  KERNEL_RELEASE: ${{ inputs.kernel_release || '' }}
  LOCALVERSION: ${{ inputs.localversion_suffix || '' }}

jobs:
  config-summary:
    runs-on: ubuntu-latest
    outputs:
      gki_branch: ${{ steps.calc.outputs.branch }}
    steps:
      - name: Build Configuration Summary
        id: calc
        run: |
          BRANCH="${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}-${{ env.OS_PATCH_LEVEL }}"
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT
          echo "============================================"
          echo "  轻微 MCP (qingwei_mcp) Driver Build"
          echo "============================================"
          echo "Android Version:  ${{ env.ANDROID_VERSION }}"
          echo "Kernel Version:   ${{ env.KERNEL_VERSION }}.${{ env.SUB_LEVEL }}"
          echo "Security Patch:   ${{ env.OS_PATCH_LEVEL }}"
          echo "GKI Branch:       ${BRANCH}"
          echo "Kernel Release:   ${{ env.KERNEL_RELEASE || '(auto-generate)' }}"
          echo "Localversion:     ${{ env.LOCALVERSION }}"
          echo "Debug Build:      ${{ inputs.debug || 'false' }}"
          echo "============================================"

  build-ko:
    needs: config-summary
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev \
            dwarves ccache build-essential git curl python3 zlib1g-dev \
            clang lld gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            pkg-config libzstd-dev

      - name: Setup ccache
        run: |
          echo "CCACHE_DIR=${HOME}/.ccache" >> $GITHUB_ENV
          ccache -M 2G
          ccache -z

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "~/bin" >> $GITHUB_PATH

      - name: Fetch AOSP GKI kernel source
        run: |
          set -euo pipefail
          FORMATTED_BRANCH="${{ needs.config-summary.outputs.gki_branch }}"
          KERNEL_ROOT="${GITHUB_WORKSPACE}/kernel-source"
          mkdir -p "${KERNEL_ROOT}"
          cd "${KERNEL_ROOT}"

          echo "初始化 repo，分支: common-${FORMATTED_BRANCH}"
          repo init --depth=1 -u https://android.googlesource.com/kernel/manifest -b "common-${FORMATTED_BRANCH}" --repo-rev=v2.16

          # 检测是否为已弃用的分支
          REMOTE_BRANCH="$(git ls-remote https://android.googlesource.com/kernel/common "${FORMATTED_BRANCH}" || true)"
          DEFAULT_MANIFEST_PATH=.repo/manifests/default.xml
          if grep -q deprecated <<< "$REMOTE_BRANCH"; then
            echo "检测到已弃用的分支: ${FORMATTED_BRANCH}"
            sed -i "s/\"${FORMATTED_BRANCH}\"/\"deprecated\/${FORMATTED_BRANCH}\"/g" "$DEFAULT_MANIFEST_PATH"
          fi

          repo sync -c -j"$(nproc --all)" --no-tags --fail-fast
          echo "内核源码同步完成: common-${FORMATTED_BRANCH}"

      - name: Patch kernel to skip resolve_btfids
        run: |
          set -euo pipefail
          KERNEL_ROOT="${GITHUB_WORKSPACE}/kernel-source/common"

          echo "=== 修补内核：跳过 resolve_btfids 构建 ==="

          # 策略：从顶层 Makefile 的 prepare 依赖中移除 resolve_btfids
          # 外部模块编译不需要 BTF ID 解析工具
          MAKEFILE="${KERNEL_ROOT}/Makefile"

          # 查看当前 resolve_btfids 相关行（用于调试）
          echo "--- Makefile 中 resolve_btfids 相关行 ---"
          grep -n 'resolve_btfids' "${MAKEFILE}" || echo "(未找到)"
          echo "-------------------------------------------"

          # 移除 prepare 对 resolve_btfids 的依赖
          # 匹配各种可能的格式: "prepare: ... resolve_btfids" 或 "prepare: resolve_btfids"
          python3 -c "
          import re
          with open('${MAKEFILE}', 'r') as f:
              content = f.read()
          # 从 prepare 依赖行中移除 resolve_btfids
          content = re.sub(r'(prepare\s*:[^=\n]*)\bresolve_btfids\b', r'\1', content)
          # 清理多余空格
          content = re.sub(r'  +', ' ', content)
          with open('${MAKEFILE}', 'w') as f:
              f.write(content)
          print('已从 prepare 依赖中移除 resolve_btfids')
          "

          echo "--- 修补后 resolve_btfids 相关行 ---"
          grep -n 'resolve_btfids' "${MAKEFILE}" || echo "(未找到)"
          echo "-------------------------------------------"

          # 保险：同时修补 resolve_btfids 自身的 Makefile，修复链接
          BTFIDS_MK="${KERNEL_ROOT}/tools/bpf/resolve_btfids/Makefile"
          if [ -f "${BTFIDS_MK}" ]; then
            # 将 LIBELF_LIBS 的非静态 fallback 从 -lelf 改为 -lelf -lzstd -lz
            sed -i 's/|| echo -lelf)/|| echo -lelf -lzstd -lz)/g' "${BTFIDS_MK}"
            echo "已修补 resolve_btfids/Makefile 链接参数 (fallback 添加 -lzstd -lz)"
            grep -n 'echo -lelf' "${BTFIDS_MK}" || true
          fi

      - name: Prepare external module source
        run: |
          MODULE_DIR="${GITHUB_WORKSPACE}/qingwei_mcp_module"
          mkdir -p "${MODULE_DIR}"
          cp -r driver/* "${MODULE_DIR}/"

          echo "Module source prepared at: ${MODULE_DIR}"
          ls -la "${MODULE_DIR}/"

      - name: Prepare kernel build environment
        run: |
          set -euo pipefail
          KERNEL_ROOT="${GITHUB_WORKSPACE}/kernel-source/common"

          cd "${KERNEL_ROOT}"

          echo "=== 配置内核 (gki_defconfig) ==="
          make ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- gki_defconfig

          # 确保禁用 BTF（避免 resolve_btfids 被需要）
          scripts/config --disable DEBUG_INFO_BTF

          # 设置精确的 kernel.release（用于匹配目标设备 uname -r）
          TARGET_RELEASE="${{ env.KERNEL_RELEASE }}"
          LOCALVERSION="${{ env.LOCALVERSION }}"

          if [ -n "${TARGET_RELEASE}" ]; then
            # 用户提供了完整的 uname -r 值，直接写入
            echo "${TARGET_RELEASE}" > include/config/kernel.release
            echo "kernel.release 设为: ${TARGET_RELEASE} (长度: ${#TARGET_RELEASE})"
            # 不写 localversion 文件，避免追加额外后缀
          else
            # 未提供完整值，自动生成并可用 localversion 后缀
            AUTO_RELEASE="${{ env.KERNEL_VERSION }}.${{ env.SUB_LEVEL }}-${{ env.ANDROID_VERSION }}-${{ env.OS_PATCH_LEVEL }}"
            echo "${AUTO_RELEASE}" > include/config/kernel.release
            echo "kernel.release 自动生成: ${AUTO_RELEASE}"

            if [ -n "${LOCALVERSION}" ]; then
              echo "${LOCALVERSION}" > localversion-qingwei
              echo "localversion written: ${LOCALVERSION}"
            fi
          fi

          echo "=== 准备模块构建环境 (modules_prepare) ==="
          make ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- modules_prepare -j$(nproc)

          echo "内核构建环境准备完成"

      - name: Build kernel module with clang
        run: |
          set -euo pipefail
          KERNEL_ROOT="${GITHUB_WORKSPACE}/kernel-source/common"
          MODULE_DIR="${GITHUB_WORKSPACE}/qingwei_mcp_module"
          DIST_DIR="${GITHUB_WORKSPACE}/ko-output"
          mkdir -p "${DIST_DIR}"

          cd "${KERNEL_ROOT}"

          echo "=== 开始编译外部模块 (clang) ==="
          echo "KERNEL_ROOT: ${KERNEL_ROOT}"
          echo "MODULE_DIR:  ${MODULE_DIR}"

          make ARCH=arm64 \
               CC="ccache clang" \
               CROSS_COMPILE=aarch64-linux-gnu- \
               LDFLAGS=-fuse-ld=lld \
               M="${MODULE_DIR}" \
               modules -j$(nproc)

          echo "=== 编译完成 ==="

          # 复制 .ko 到输出目录
          KO_FILE=$(find "${MODULE_DIR}" -name "qingwei_mcp.ko" -type f | head -1)
          if [ -z "${KO_FILE}" ]; then
            echo "ERROR: qingwei_mcp.ko not found!"
            find "${MODULE_DIR}" -name "*.ko" -type f || true
            exit 1
          fi

          cp "${KO_FILE}" "${DIST_DIR}/qingwei_mcp.ko"
          echo "模块已复制: ${DIST_DIR}/qingwei_mcp.ko"

      - name: Generate metadata
        run: |
          set -euo pipefail
          DIST_DIR="${GITHUB_WORKSPACE}/ko-output"

          echo "=== 轻微 MCP (qingwei_mcp) Driver Build Metadata ===" > "${DIST_DIR}/metadata.txt"
          echo "Build Date: $(date -u)" >> "${DIST_DIR}/metadata.txt"
          echo "Android Version: ${{ env.ANDROID_VERSION }}" >> "${DIST_DIR}/metadata.txt"
          echo "Kernel Version: ${{ env.KERNEL_VERSION }}.${{ env.SUB_LEVEL }}" >> "${DIST_DIR}/metadata.txt"
          echo "Security Patch: ${{ env.OS_PATCH_LEVEL }}" >> "${DIST_DIR}/metadata.txt"
          echo "SHA256: $(sha256sum ${DIST_DIR}/qingwei_mcp.ko | cut -d' ' -f1)" >> "${DIST_DIR}/metadata.txt"
          echo "Size: $(stat -c%s ${DIST_DIR}/qingwei_mcp.ko) bytes" >> "${DIST_DIR}/metadata.txt"
          modinfo "${DIST_DIR}/qingwei_mcp.ko" 2>/dev/null >> "${DIST_DIR}/metadata.txt" || true

          cat "${DIST_DIR}/metadata.txt"

      - name: Upload .ko artifact
        uses: actions/upload-artifact@v4
        with:
          name: qingwei_mcp-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}
          path: |
            ko-output/qingwei_mcp.ko
            ko-output/metadata.txt
          retention-days: 30

      - name: Upload debug symbols
        if: ${{ inputs.debug }}
        uses: actions/upload-artifact@v4
        with:
          name: qingwei_mcp-debug-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}
          path: ko-output/*.ko.debug
          retention-days: 30
          if-no-files-found: ignore
